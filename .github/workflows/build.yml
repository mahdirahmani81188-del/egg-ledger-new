
name: Build EggLedger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: unzip -o EggLedger-Android-v2.zip -d .

      - name: Build APK
        run: gradle -p eggledger_build assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EggLedger-debug-APK
          path: eggledger_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
